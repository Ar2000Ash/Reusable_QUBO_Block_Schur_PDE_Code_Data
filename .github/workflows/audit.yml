name: Verify corrected QPDE computational archive

on:
  push:
    branches:
      - main
      - audit/fix-dirac3-signed-decode
      - audit/direct-qubos-pde-rebuild
      - reconstruction/exact-oracle-five-pde-stage1
  pull_request:
  workflow_dispatch:

jobs:
  numerical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qpde_schur_qubo_reproducibility
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: qpde_schur_qubo_reproducibility/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src experiments analysis
      - name: Verify archived SHA256 checksums
        run: sha256sum -c SHA256SUMS.txt
      - name: Verify 34 directly accessible reconstructed input QUBOs
        run: python analysis/check_qci_input_qubos.py
      - name: Reconstruct the three terminal PDE fields independently
        run: python analysis/reconstruct_dirac3_pde.py
      - name: Rebuild processed datasets
        run: python analysis/build_processed_data.py
      - name: Independently verify all Dirac-3 decoded bitstrings
        run: python analysis/check_dirac3_decode.py
      - name: Verify numerical summaries
        run: python analysis/verify_results.py
      - name: Audit archived hardware records
        run: python analysis/audit_dirac3.py
      - name: Regenerate all result figures
        run: python analysis/generate_figures.py
      - name: Re-run large-block experiment
        run: python experiments/run_large_block.py --output /tmp/qpde_large_block_summary.csv
      - name: Verify original QCI raw responses and reconstructed pre/post-processing
        run: python analysis/verify_qci_recovery.py
      - name: Independently reconstruct Figure 2 from all 14 source experiment rows and slopes
        run: python experimental_reconstruction/tests/check_figure2.py
      - name: Audit explicit Figure 3 auto-bound and correction-scale hypotheses
        run: python experimental_reconstruction/src/figure3_scale_audit.py
      - name: Independently verify reconstructed oracle and five-PDE boundary fingerprints
        run: |
          python experimental_reconstruction/tests/check_oracle.py
          python experimental_reconstruction/tests/check_archived_qci.py
          python experimental_reconstruction/tests/check_boundaries.py
          python experimental_reconstruction/tests/check_torch_full.py
          python experimental_reconstruction/tests/compare_results.py
