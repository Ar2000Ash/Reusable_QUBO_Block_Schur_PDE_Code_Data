name: Verify code and data package

on:
  push:
  pull_request:

jobs:
  numerical-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild processed data
        run: python analysis/build_processed_data.py

      - name: Verify archived numerical results
        run: python analysis/verify_results.py

      - name: Audit stored Dirac-3 hardware records
        run: python analysis/audit_dirac3.py

      - name: Regenerate result figures
        run: python analysis/generate_figures.py

      - name: Smoke-test the rerunnable large-block experiment
        run: python experiments/run_large_block.py --output /tmp/large_block_summary.csv
